[project]
name = "pytorch-tutorial"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightning>=2.6.6",
    "ipython",
    "torchvision>=0.29.1",
    "pyarrow>=26.0.0",
    "pandas>=2.2,<3.0",
    "pyspark>=4.1,<4.2",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "pydantic>=2.0",
]

[project.scripts]
pytorch-tutorial-train = "pytorch_tutorial.train:main"
pytorch-tutorial-download-ohlcv = "pytorch_tutorial.market_data:main"
pytorch-tutorial-extract-long-short-labels = "pytorch_tutorial.labels:main"
pytorch-tutorial-parquet-explorer = "pytorch_tutorial.parquet_explorer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
