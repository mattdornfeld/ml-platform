# @package _global_
# One-bar close-to-close log return, computed independently for each symbol.
name: log_return
version: 1
dtype: double
frequency: daily
feature_keys: [symbol]
datasets:
  - name: sp500
    version: 3
    argument_name: market_data
    # Use one preceding daily market-data partition for lineage.
    num_lookback_partitions: 1
transform: ml_platform.data_sdk.LogReturnTransform
description: One-bar close-to-close log return.
validations:
  - type: minimum_rows
    minimum_rows: 1
  - type: finite_feature_value
  - type: feature_keys_from_input
