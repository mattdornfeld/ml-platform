[project]
name = "pytorch-tutorial"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightning>=2.6.6",
    "ipython",
    "torchvision>=0.29.1",
    "pyarrow>=26.0.0",
    "pandas>=2.2,<3.0",
    "pyspark>=4.1,<4.2",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
pytorch-tutorial-train = "sdk.train:main"
pytorch-tutorial-download-ohlcv = "sdk.market_data:main"
pytorch-tutorial-extract-long-short-labels = "sdk.labels:main"
pytorch-tutorial-create-feature = "sdk.feature_harness:main"
pytorch-tutorial-parquet-explorer = "sdk.parquet_explorer:main"
pytorch-tutorial-api = "api.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx2>=0.28",
]
