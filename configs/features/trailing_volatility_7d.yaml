# @package _global_
# Sample standard deviation of the preceding 168 hourly log returns.
name: trailing_volatility_7d
version: 1
dtype: double
frequency: daily
feature_keys: [symbol]
datasets:
  - name: sp500
    version: 3
    dataset_type: market_data
    argument_name: market_data
    # Market data is daily-partitioned; use seven preceding daily partitions.
    input_window:
      lookback_partitions: 7
transform: ml_platform.data_sdk.TrailingVolatilityTransform
description: Seven-day trailing sample volatility of hourly log returns.
parameters:
  lookback_bars: 168
