apiVersion: v1
kind: ServiceAccount
metadata: {name: ml-control-plane, namespace: ml-platform}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: spark-submit, namespace: ml-platform}
rules:
- apiGroups: [sparkoperator.k8s.io]
  resources: [sparkapplications]
  verbs: [create, delete, get, list, patch, watch]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods, services, configmaps, persistentvolumeclaims]
  verbs: [create, delete, deletecollection, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: spark-submit, namespace: ml-platform}
subjects: [{kind: ServiceAccount, name: ml-control-plane, namespace: ml-platform}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: spark-submit}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ml-control-plane, namespace: ml-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: ml-control-plane}}
  template:
    metadata: {labels: {app: ml-control-plane}}
    spec:
      serviceAccountName: ml-control-plane
      containers:
      - name: ml-control-plane
        image: ml-platform:latest
        imagePullPolicy: IfNotPresent
        command: [python]
        args: [-m, uvicorn, ml_platform.api.app:app, --host, 0.0.0.0, --port, '8000']
        env:
        - {name: DATABASE_URL, value: postgresql://postgres@postgres:5432/ml_platform}
        - {name: DATA_WAREHOUSE_DIR, value: s3a://warehouse}
        - {name: KUBERNETES_NAMESPACE, value: ml-platform}
        - {name: HEADLAMP_URL, value: http://127.0.0.1:8002}
        - {name: MATERIALIZATION_IMAGE, value: ml-platform:latest}
        - {name: S3_ENDPOINT, value: http://minio:9000}
        - {name: MINIO_CONSOLE_URL, value: http://127.0.0.1:9003}
        envFrom: [{secretRef: {name: minio-credentials}}]
        ports: [{containerPort: 8000}]
---
apiVersion: v1
kind: Service
metadata: {name: ml-control-plane, namespace: ml-platform}
spec: {selector: {app: ml-control-plane}, ports: [{port: 8000, targetPort: 8000}]}
