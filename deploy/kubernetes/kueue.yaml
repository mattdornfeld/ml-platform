# The API submits SparkApplications to this LocalQueue. It controls data-partition
# eligibility with its admission gate; Kueue controls resource admission after that
# gate is removed.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: materialization
spec:
  namespaceSelector: {}
  queueingStrategy: StrictFIFO
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: default
          resources:
            - name: cpu
              nominalQuota: "8"
            - name: memory
              nominalQuota: 48Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: materialization
  namespace: ml-platform
spec:
  clusterQueue: materialization
