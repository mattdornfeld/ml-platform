# @package _global_
# Current volume divided by mean volume over preceding hourly bars.
name: relative_volume
version: 1
dtype: double
frequency: hourly
feature_keys: [symbol]
datasets:
  - name: sp500
    version: 3
    dataset_type: market_data
    argument_name: market_data
    # Market data is daily-partitioned; use one preceding daily partition.
    num_lookback_partitions: 1
transform: ml_platform.data_sdk.RelativeVolumeTransform
description: Current volume divided by trailing mean volume.
parameters:
  lookback_bars: 24
