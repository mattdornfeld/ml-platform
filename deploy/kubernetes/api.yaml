apiVersion: v1
kind: ServiceAccount
metadata: {name: materialization-api, namespace: materialization}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: spark-submit, namespace: materialization}
rules:
- apiGroups: [sparkoperator.k8s.io]
  resources: [sparkapplications]
  verbs: [create, delete, get, list, patch, watch]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods, services, configmaps, persistentvolumeclaims]
  verbs: [create, delete, deletecollection, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: spark-submit, namespace: materialization}
subjects: [{kind: ServiceAccount, name: materialization-api, namespace: materialization}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: spark-submit}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: materialization}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      serviceAccountName: materialization-api
      containers:
      - name: api
        image: ml-platform:latest
        imagePullPolicy: IfNotPresent
        command: [python]
        args: [-m, uvicorn, ml_platform.api.main:app, --host, 0.0.0.0, --port, '8000']
        env:
        - {name: DATABASE_URL, value: postgresql://postgres@postgres:5432/ml_platform}
        - {name: DATA_WAREHOUSE_DIR, value: s3a://warehouse}
        - {name: KUBERNETES_NAMESPACE, value: materialization}
        - {name: MATERIALIZATION_IMAGE, value: ml-platform:latest}
        - {name: S3_ENDPOINT, value: http://minio:9000}
        envFrom: [{secretRef: {name: minio-credentials}}]
        ports: [{containerPort: 8000}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: materialization}
spec: {selector: {app: api}, ports: [{port: 8000, targetPort: 8000}]}
