# Barriers are trailing-volatility multiples calculated from hourly log returns.
name: hourly_triple_barrier
version: 2
description: Triple-barrier long-short labels from hourly market data.
dtype: int
frequency: daily
keys: [symbol]
datasets:
  - name: sp500
    version: 3
    input_window:
      lookback_partitions: 1
      lookahead_partitions: 1
transform: ml_platform.data_sdk.TripleBarrierLabelTransform
parameters:
  horizon_bars: 24
  volatility_lookback_bars: 24
  profit_taking_multiplier: 1.0
  stop_loss_multiplier: 1.0
