apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-platform-headlamp
  namespace: headlamp
---
# Kubernetes' built-in view role excludes Secrets and grants no write verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ml-platform-headlamp-view
subjects:
- kind: ServiceAccount
  name: ml-platform-headlamp
  namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
# SparkApplication and Kueue are CRDs, so grant the Headlamp service account
# the same strictly read-only access to those resources and CRD definitions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ml-platform-headlamp-custom-resource-reader
rules:
- apiGroups: [apiextensions.k8s.io]
  resources: [customresourcedefinitions]
  verbs: [get, list, watch]
- apiGroups: [sparkoperator.k8s.io]
  resources: [sparkapplications, scheduledsparkapplications, sparkconnects]
  verbs: [get, list, watch]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads, localqueues, clusterqueues]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ml-platform-headlamp-custom-resource-reader
subjects:
- kind: ServiceAccount
  name: ml-platform-headlamp
  namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ml-platform-headlamp-custom-resource-reader
