apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: ml-platform}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: ml-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:18.6
        env: [{name: POSTGRES_DB, value: ml_platform}, {name: POSTGRES_USER, value: postgres}, {name: POSTGRES_HOST_AUTH_METHOD, value: trust}]
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: ml-platform}
spec: {selector: {app: postgres}, ports: [{port: 5432, targetPort: 5432}]}
