# @package _global_
# Sample standard deviation of the preceding 24 hourly log returns.
name: trailing_volatility_1d
version: 1
dtype: double
frequency: daily
feature_key: symbol
datasets:
  - name: sp500
    version: 3
    # Market data is daily-partitioned; use one preceding daily partition.
    num_lookback_partitions: 1
transform: ml_platform.data_sdk.TrailingVolatilityTransform
description: One-day trailing sample volatility of hourly log returns.
parameters:
  lookback_bars: 24
validations:
  min_rows_per_partition: 1
