[project]
name = "ml-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightning>=2.6.6",
    "ipython",
    "torchvision>=0.29.1",
    "pyarrow>=26.0.0",
    "pandas>=2.2,<3.0",
    "pyspark>=4.1,<4.2",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "kubernetes>=32.0",
    "simple-classproperty>=4.0.2",
    "exchange-calendars>=4.13,<5",
]

[project.scripts]
ml-platform-train = "ml_platform.model_sdk.train:main"
ml-platform-parquet-explorer = "ml_platform.data_sdk.utils.data_explorer:main"
ml-platform-api = "ml_platform.api.main:main"
ml-platform-materialize-dataset = "ml_platform.data_sdk.materializers._dataset:main"
ml-platform = "ml_platform.cli.materialization:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx2>=0.28",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-ruff>=0.5",
    "ruff>=0.17.2",
    "types-requests>=2.33.0.20261006",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["exchange_calendars", "pyarrow", "pyarrow.*", "torchvision"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "--ruff --ruff-format"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
