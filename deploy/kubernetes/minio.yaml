apiVersion: v1
kind: Secret
metadata: {name: minio-credentials, namespace: materialization}
type: Opaque
stringData: {MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: miniosecret}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: minio-data, namespace: materialization}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: materialization}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
      - name: minio
        image: ml-platform-minio:latest
        imagePullPolicy: IfNotPresent
        args: [server, /data]
        envFrom: [{secretRef: {name: minio-credentials}}]
        ports: [{containerPort: 9000}]
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: minio-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: materialization}
spec: {selector: {app: minio}, ports: [{port: 9000, targetPort: 9000}]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: create-warehouse-bucket, namespace: materialization}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-bucket
        image: ml-platform-minio:latest
        imagePullPolicy: IfNotPresent
        envFrom: [{secretRef: {name: minio-credentials}}]
        command: [/bin/sh, -ec]
        args: ["mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD; mc mb --ignore-existing local/warehouse"]
