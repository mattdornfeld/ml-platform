[project]
name = "ml-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightning>=2.6.6",
    "ipython",
    "torchvision>=0.29.1",
    "pyarrow>=26.0.0",
    "pandas>=2.2,<3.0",
    "pyspark>=4.1,<4.2",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "kubernetes>=32.0",
    "simple-classproperty>=4.0.2",
    "exchange-calendars>=4.13,<5",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "httpx2>=2.15,<3",
]

[project.scripts]
ml-platform-train = "ml_platform.model_sdk.train:main"
ml-platform-parquet-explorer = "ml_platform.data_sdk.utils.data_explorer:main"
ml-platform-api = "ml_platform.api.app:main"
ml-platform-materialize-dataset = "ml_platform.data_sdk.materializers._dataset:main"
ml-platform = "ml_platform.cli.materialization:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "kubernetes-stubs>=22.6.0.post1",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-ruff>=0.5",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.13,<5",
    "types-requests>=2.33.0.20261006",
]

[tool.alembic]
script_location = "%(here)s/src/ml_platform/api/infrastructure/alembic"
prepend_sys_path = ["%(here)s", "%(here)s/src"]

[tool.mypy]
warn_unreachable = true
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["exchange_calendars", "pyarrow", "pyarrow.*", "torchvision"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "--ruff --ruff-format"

[tool.ruff]
target-version = "py312"
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "D",
    "DTZ", "E", "ERA", "EXE", "F", "FA", "FBT", "FLY",
    "FURB", "G", "I", "ICN", "INP", "ISC", "LOG", "N", "PERF", "PGH",
    "PIE", "PTH", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLOT", "T10",
    "T20", "TCH", "TID", "UP", "PLC2701",
    "W", "YTT",
]
# Ruff format owns whitespace, quotes, commas, indentation, and line wrapping.
# E501 is excluded because the formatter intentionally preserves unavoidable long
# URLs, SQL, and Spark identifiers that Google permits as exceptions.
ignore = ["COM812", "D203", "D213", "E111", "E114", "E117", "E501", "ISC001", "Q000", "Q001", "Q002", "Q003", "W191"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Google does not require docstrings for test modules; pytest assertions are
# intentional and tests exercise private implementation contracts directly.
"tests/**/*.py" = ["ANN", "ARG", "D", "S101", "S106", "SLF001", "T201"]

[tool.ruff.format]
docstring-code-format = true
