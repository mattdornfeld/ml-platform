# @package _global_
# Sample standard deviation of the preceding 168 hourly log returns.
name: trailing_volatility_7d
version: 1
dtype: double
frequency: daily
feature_key: symbol
datasets:
  - dataset_id: market_data.hourly_ohlcv
    # Market data is daily-partitioned; use seven preceding daily partitions.
    num_lookback_partitions: 7
transform: ml_platform.data_sdk.features.trailing_volatility.TrailingVolatilityTransform
description: Seven-day trailing sample volatility of hourly log returns.
parameters:
  lookback_bars: 168
validations:
  min_rows_per_partition: 1
